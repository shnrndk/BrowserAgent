worker_processes 1;
daemon off;
events { worker_connections 1024; }

http {
    server {
        listen 8888;
        server_name localhost;

        # --- CACHE BUSTER: If the browser forces /content/, rewrite it BACK to /wiki/ ---
        location /content/ {
            rewrite ^/content/(.*)$ /wiki/$1 permanent;
        }

        location = /search { return 301 /wiki/search?$args; }
        location = /random { return 301 /wiki/random?$args; }
        location ~ ^/wikipedia_en_all_maxi_2022-05 { return 301 /wiki$request_uri; }

        # --- ROUTING FIX: Map /wiki/ directly to Kiwix's /content/ path under the hood ---
        location /wiki/ {
            proxy_pass http://localhost:22015/content/;
            proxy_buffering off;
            proxy_set_header Host $host;

            # Intercept any backend redirects Kiwix tries to send and rewrite them
            proxy_redirect /content/ /wiki/;
            proxy_redirect http://localhost:22015/content/ /wiki/;

            sub_filter_once off;
            sub_filter '<a href="/' '<a href="/wiki/';
            sub_filter '<link href="/' '<link href="/wiki/';
            sub_filter '<script src="/' '<script src="/wiki/';
            sub_filter '<img src="/' '<img src="/wiki/';
            sub_filter 'href="/search/' 'href="/wiki/search/';
            sub_filter 'href="/random/' 'href="/wiki/random/';
            sub_filter 'href="/wikipedia_en_all_maxi_2022-05/' 'href="/wiki/wikipedia_en_all_maxi_2022-05/';
            sub_filter 'action="/search' 'action="/wiki/search';
            sub_filter 'src="/wikipedia_en_all_maxi_2022-05/' 'src="/wiki/wikipedia_en_all_maxi_2022-05/';
            sub_filter '<div id="mw-mf-page-center">' '<div id="simpleSearch" style="padding:10px;background:#f8f9fa;border-bottom:1px solid #a2a9b1;margin-bottom:10px;"><form action="/wiki/search" method="get"><input type="hidden" name="content" value="wikipedia_en_all_maxi_2022-05"><input type="text" name="pattern" id="searchInput" placeholder="Search Wikipedia" style="padding:5px;width:300px;"><button type="submit" id="searchButton" style="padding:5px;">Search</button></form></div><div id="mw-mf-page-center">';
            # Also inject into the search results page which doesn't have mw-mf-page-center
            sub_filter '<body>' '<body><div id="simpleSearch" style="padding:10px;background:#f8f9fa;border-bottom:1px solid #a2a9b1;margin-bottom:10px;"><form action="/wiki/search" method="get"><input type="hidden" name="content" value="wikipedia_en_all_maxi_2022-05"><input type="text" name="pattern" id="searchInput" placeholder="Search Wikipedia" style="padding:5px;width:300px;"><button type="submit" id="searchButton" style="padding:5px;">Search</button></form></div>';
        }
    }
}